<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      color: #7c3aed;
      text-transform: uppercase;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem;
      width: 740px;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .columns {
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .col-left, .col-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .col-left { padding-right: 1.8rem; }
    .col-right { padding-left: 1.8rem; }

    .col-divider {
      width: 1px;
      background: #2a2a2a;
      align-self: stretch;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    label {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
    }

    .freq-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #333;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #7c3aed;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { background: #9d5cf6; }

    input[type="number"] {
      width: 90px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem;
      padding: 0.4rem 0.6rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus { border-color: #7c3aed; }

    .freq-display {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #7c3aed;
      letter-spacing: 0.05em;
    }

    .freq-display span {
      font-size: 1rem;
      color: #888;
      font-weight: 400;
    }

    canvas {
      width: 100%;
      height: 100px;
      border-radius: 8px;
      background: #111;
      display: block;
    }

    .controls { display: flex; gap: 1rem; }

    button {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #playBtn { background: #7c3aed; color: #fff; }
    #playBtn:hover { opacity: 0.85; }
    #playBtn.playing { background: #ef4444; }

    .volume-row { display: flex; align-items: center; gap: 1rem; }
    .volume-row input[type="range"] { flex: 1; }

    .vol-label {
      font-size: 0.85rem;
      color: #aaa;
      min-width: 36px;
      text-align: right;
    }

    .wave-toggle {
      display: flex;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .wave-toggle button {
      flex: 1;
      padding: 0.5rem;
      border-radius: 7px;
      background: transparent;
      color: #666;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      transform: none;
    }

    .wave-toggle button:active { transform: none; }
    .wave-toggle button.active { background: #7c3aed; color: #fff; }
    .wave-toggle button:not(.active):hover { color: #ccc; }

    /* ── Keyboard ── */
    .keyboard-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .keyboard-hint {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .keyboard {
      position: relative;
      user-select: none;
    }

    .key {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
      cursor: pointer;
      border-radius: 0 0 5px 5px;
    }

    .key.white {
      background: #ddd;
      border: 1px solid #888;
      border-top: none;
      z-index: 1;
      transition: background 0.05s;
    }

    .key.white:hover { background: #ccc8f8; }
    .key.white.active { background: #a78bfa; }

    .key.black {
      background: #1c1c1c;
      border: 1px solid #000;
      border-top: none;
      z-index: 2;
      transition: background 0.05s;
    }

    .key.black:hover { background: #333; }
    .key.black.active { background: #7c3aed; }

    .key-shortcut {
      font-size: 10px;
      font-weight: 700;
      color: #777;
      line-height: 1;
    }

    .key.white.active .key-shortcut,
    .key.black.active .key-shortcut { color: #fff; }

    .key.black .key-shortcut { color: #999; font-size: 9px; }

    .key-note {
      font-size: 8px;
      color: #aaa;
      margin-top: 2px;
      line-height: 1;
    }

    .key.white.active .key-note { color: #ede9fe; }

    /* ── Octave shift ── */
    .octave-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .octave-row label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    .octave-slider-wrap {
      display: flex;
      flex-direction: column;
      width: 200px;
      gap: 0.2rem;
    }

    #octaveSlider { width: 100%; }

    .octave-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #555;
      padding: 0 6px;
    }

    .octave-ticks span.active-tick { color: #7c3aed; font-weight: 700; }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 0.2rem;
    }

    .filter-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .filter-field {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .filter-field label {
      width: 72px;
      flex-shrink: 0;
    }

    .filter-field input[type="range"] { flex: 1; }

    .filter-val {
      font-size: 0.8rem;
      color: #aaa;
      min-width: 62px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Tone Generator</h1>

  <div class="card">
    <div class="freq-display" id="freqDisplay">440 <span>Hz</span></div>

    <div class="columns">
      <div class="col-left">
        <div class="field">
          <label>Frequency</label>
          <div class="freq-row">
            <input type="range" id="freqSlider" min="20" max="2000" value="440" step="1">
            <input type="number" id="freqInput" min="20" max="20000" value="440">
          </div>
        </div>

        <div class="field">
          <label>Volume</label>
          <div class="volume-row">
            <input type="range" id="volSlider" min="0" max="100" value="50" step="1">
            <span class="vol-label" id="volDisplay">50%</span>
          </div>
        </div>

        <div class="field">
          <label>Wave Type</label>
          <div class="wave-toggle">
            <button id="btnSine">Sine</button>
            <button id="btnSquare" class="active">Square</button>
          </div>
        </div>
      </div>

      <div class="col-divider"></div>

      <div class="col-right">
        <div class="field">
          <label class="section-label">Filter</label>
          <div class="filter-grid">
            <div class="filter-field">
              <label>Cutoff</label>
              <input type="range" id="cutoffSlider" min="20" max="20000" value="20000" step="1">
              <span class="filter-val" id="cutoffDisplay">20000 Hz</span>
            </div>
            <div class="filter-field">
              <label>Resonance</label>
              <input type="range" id="resonanceSlider" min="0.01" max="25" value="1" step="0.01">
              <span class="filter-val" id="resonanceDisplay">1.00</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="section-label">Envelope</label>
          <div class="filter-grid">
            <div class="filter-field">
              <label>Attack</label>
              <input type="range" id="attackSlider" min="0" max="5" value="0.01" step="0.01">
              <span class="filter-val" id="attackDisplay">0.01 s</span>
            </div>
            <div class="filter-field">
              <label>Decay</label>
              <input type="range" id="decaySlider" min="0" max="5" value="0.1" step="0.01">
              <span class="filter-val" id="decayDisplay">0.10 s</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Waveform</label>
      <canvas id="scope" width="690" height="100"></canvas>
    </div>

    <div class="controls">
      <button id="playBtn">Play</button>
    </div>
  </div>

  <div class="keyboard-section">
    <div class="octave-row">
      <label>Octave Shift</label>
      <div class="octave-slider-wrap">
        <input type="range" id="octaveSlider" min="-1" max="1" step="1" value="0">
        <div class="octave-ticks">
          <span id="tick-1">Oct -1</span>
          <span id="tick0" class="active-tick">Normal</span>
          <span id="tick1">Oct +1</span>
        </div>
      </div>
    </div>
    <div class="keyboard" id="keyboard"></div>
    <div class="keyboard-hint">Z–M &amp; Q–I · sharps: S D G H J &amp; 2 3 5 6 7</div>
  </div>

  <script>
    // ── Note table ──
    const NOTES = [
      { id: 'C4',  freq: 261.63,  type: 'white', key: 'z', label: 'C4'  },
      { id: 'Cs4', freq: 277.18,  type: 'black', key: 's', label: 'C#4' },
      { id: 'D4',  freq: 293.66,  type: 'white', key: 'x', label: 'D4'  },
      { id: 'Ds4', freq: 311.13,  type: 'black', key: 'd', label: 'D#4' },
      { id: 'E4',  freq: 329.63,  type: 'white', key: 'c', label: 'E4'  },
      { id: 'F4',  freq: 349.23,  type: 'white', key: 'v', label: 'F4'  },
      { id: 'Fs4', freq: 369.99,  type: 'black', key: 'g', label: 'F#4' },
      { id: 'G4',  freq: 392.00,  type: 'white', key: 'b', label: 'G4'  },
      { id: 'Gs4', freq: 415.30,  type: 'black', key: 'h', label: 'G#4' },
      { id: 'A4',  freq: 440.00,  type: 'white', key: 'n', label: 'A4'  },
      { id: 'As4', freq: 466.16,  type: 'black', key: 'j', label: 'A#4' },
      { id: 'B4',  freq: 493.88,  type: 'white', key: 'm', label: 'B4'  },
      { id: 'C5',  freq: 523.25,  type: 'white', key: 'q', label: 'C5'  },
      { id: 'Cs5', freq: 554.37,  type: 'black', key: '2', label: 'C#5' },
      { id: 'D5',  freq: 587.33,  type: 'white', key: 'w', label: 'D5'  },
      { id: 'Ds5', freq: 622.25,  type: 'black', key: '3', label: 'D#5' },
      { id: 'E5',  freq: 659.25,  type: 'white', key: 'e', label: 'E5'  },
      { id: 'F5',  freq: 698.46,  type: 'white', key: 'r', label: 'F5'  },
      { id: 'Fs5', freq: 739.99,  type: 'black', key: '5', label: 'F#5' },
      { id: 'G5',  freq: 783.99,  type: 'white', key: 't', label: 'G5'  },
      { id: 'Gs5', freq: 830.61,  type: 'black', key: '6', label: 'G#5' },
      { id: 'A5',  freq: 880.00,  type: 'white', key: 'y', label: 'A5'  },
      { id: 'As5', freq: 932.33,  type: 'black', key: '7', label: 'A#5' },
      { id: 'B5',  freq: 987.77,  type: 'white', key: 'u', label: 'B5'  },
      { id: 'C6',  freq: 1046.50, type: 'white', key: 'i', label: 'C6'  },
    ];

    const keyToNote = Object.fromEntries(NOTES.map(n => [n.key, n]));

    // ── Audio state ──
    let audioCtx    = null;
    let oscillator  = null;
    let gainNode    = null;
    let filterNode  = null;
    let analyserNode = null;
    let analyserBuf  = null;
    let animFrameId = null;
    let playing    = false;
    let waveType   = 'square';
    let playButtonOn = false;
    let currentFreq  = 440;

    const activeKeys = new Map(); // key char → note (preserves insertion order)
    let octaveShift = 0;

    // ── DOM ──
    const freqSlider  = document.getElementById('freqSlider');
    const freqInput   = document.getElementById('freqInput');
    const freqDisplay = document.getElementById('freqDisplay');
    const volSlider   = document.getElementById('volSlider');
    const volDisplay  = document.getElementById('volDisplay');
    const playBtn     = document.getElementById('playBtn');
    const btnSine     = document.getElementById('btnSine');
    const btnSquare   = document.getElementById('btnSquare');
    const canvas          = document.getElementById('scope');
    const ctx             = canvas.getContext('2d');
    const cutoffSlider     = document.getElementById('cutoffSlider');
    const cutoffDisplay    = document.getElementById('cutoffDisplay');
    const resonanceSlider  = document.getElementById('resonanceSlider');
    const resonanceDisplay = document.getElementById('resonanceDisplay');
    const attackSlider     = document.getElementById('attackSlider');
    const attackDisplay    = document.getElementById('attackDisplay');
    const decaySlider      = document.getElementById('decaySlider');
    const decayDisplay     = document.getElementById('decayDisplay');

    // ── Helpers ──
    function getSliderFreq() { return parseFloat(freqInput.value) || 440; }
    function getVolume()     { return parseInt(volSlider.value) / 100; }
    function getCutoff()     { return parseFloat(cutoffSlider.value); }
    function getResonance()  { return parseFloat(resonanceSlider.value); }
    function getAttack()     { return parseFloat(attackSlider.value); }
    function getDecay()      { return parseFloat(decaySlider.value); }
    function shiftedFreq(note) { return note.freq * Math.pow(2, octaveShift); }
    function shiftedLabel(label) { return label.replace(/(\d+)$/, n => parseInt(n) + octaveShift); }

    function updateFreqDisplay(freq) {
      currentFreq = freq;
      freqDisplay.innerHTML = `${Math.round(freq * 10) / 10} <span>Hz</span>`;
    }

    // ── Audio engine ──
    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      const vol = getVolume();
      const attack = getAttack();
      const decay = getDecay();
      const now = audioCtx.currentTime;
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(vol, now + Math.max(attack, 0.001));
      gainNode.gain.linearRampToValueAtTime(vol * 0.7, now + Math.max(attack, 0.001) + Math.max(decay, 0.001));
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = getCutoff();
      filterNode.Q.value = getResonance();
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 8192;
      analyserBuf = new Uint8Array(analyserNode.fftSize);
      gainNode.connect(filterNode);
      filterNode.connect(analyserNode);
      analyserNode.connect(audioCtx.destination);
      oscillator = audioCtx.createOscillator();
      oscillator.type = waveType;
      oscillator.frequency.value = currentFreq;
      oscillator.connect(gainNode);
      oscillator.start();
      playing = true;
    }

    function teardownAudio() {
      if (!audioCtx) return;
      oscillator.stop();
      oscillator.disconnect();
      gainNode.disconnect();
      filterNode.disconnect();
      analyserNode.disconnect();
      audioCtx.close();
      oscillator   = null;
      gainNode     = null;
      filterNode   = null;
      analyserNode = null;
      analyserBuf  = null;
      audioCtx     = null;
      playing      = false;
    }

    function setOscFreq(freq) {
      if (oscillator) oscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.005);
    }

    // Central function: decides what the oscillator should do based on all inputs
    function updateTone() {
      const keyStack = [...activeKeys.values()];

      if (keyStack.length > 0) {
        const note = keyStack[keyStack.length - 1]; // last pressed = highest priority
        const freq = shiftedFreq(note);
        ensureAudio();
        setOscFreq(freq);
        updateFreqDisplay(freq);
        freqSlider.value = Math.min(freq, 2000);
        freqInput.value = Math.round(freq);
      } else if (playButtonOn) {
        const freq = getSliderFreq();
        ensureAudio();
        setOscFreq(freq);
        updateFreqDisplay(freq);
      } else {
        teardownAudio();
      }

      // Sync animation loop with playing state
      if (playing && !animFrameId) drawScope();
      if (!playing && animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
        drawStatic();
      }
    }

    // ── Controls ──
    freqSlider.addEventListener('input', () => {
      freqInput.value = freqSlider.value;
      updateFreqDisplay(+freqSlider.value);
      if (playButtonOn && activeKeys.size === 0) setOscFreq(getSliderFreq());
      if (!playing) drawStatic();
    });

    freqInput.addEventListener('input', () => {
      const val = Math.min(Math.max(parseInt(freqInput.value) || 20, 20), 20000);
      freqSlider.value = Math.min(val, 2000);
      updateFreqDisplay(val);
      if (playButtonOn && activeKeys.size === 0) setOscFreq(getSliderFreq());
      if (!playing) drawStatic();
    });

    cutoffSlider.addEventListener('input', () => {
      const val = getCutoff();
      cutoffDisplay.textContent = val >= 1000 ? `${(val / 1000).toFixed(1)} kHz` : `${Math.round(val)} Hz`;
      if (filterNode) filterNode.frequency.setTargetAtTime(val, audioCtx.currentTime, 0.01);
    });

    resonanceSlider.addEventListener('input', () => {
      resonanceDisplay.textContent = parseFloat(resonanceSlider.value).toFixed(2);
      if (filterNode) filterNode.Q.setTargetAtTime(getResonance(), audioCtx.currentTime, 0.01);
    });

    attackSlider.addEventListener('input', () => {
      attackDisplay.textContent = parseFloat(attackSlider.value).toFixed(2) + ' s';
    });

    decaySlider.addEventListener('input', () => {
      decayDisplay.textContent = parseFloat(decaySlider.value).toFixed(2) + ' s';
    });

    volSlider.addEventListener('input', () => {
      volDisplay.textContent = volSlider.value + '%';
      if (gainNode) gainNode.gain.setTargetAtTime(getVolume(), audioCtx.currentTime, 0.01);
    });

    playBtn.addEventListener('click', () => {
      playButtonOn = !playButtonOn;
      playBtn.textContent = playButtonOn ? 'Stop' : 'Play';
      playBtn.classList.toggle('playing', playButtonOn);
      updateTone();
    });

    function setWaveType(type) {
      waveType = type;
      btnSine.classList.toggle('active', type === 'sine');
      btnSquare.classList.toggle('active', type === 'square');
      if (oscillator) oscillator.type = type;
      if (!playing) drawStatic();
    }

    btnSine.addEventListener('click', () => setWaveType('sine'));
    btnSquare.addEventListener('click', () => setWaveType('square'));

    document.getElementById('octaveSlider').addEventListener('input', function () {
      octaveShift = parseInt(this.value);

      // Update tick highlight
      ['tick-1', 'tick0', 'tick1'].forEach((id, i) => {
        document.getElementById(id).classList.toggle('active-tick', i - 1 === octaveShift);
      });

      // Update key labels
      NOTES.forEach(n => {
        if (n.type === 'white') {
          const el = keyEl(n.id)?.querySelector('.key-note');
          if (el) el.textContent = shiftedLabel(n.label);
        }
      });

      // Re-pitch any currently held keys immediately
      updateTone();
    });

    // ── Waveform drawing ──
    function drawFromBuffer(color, buf, offset = 0, windowSize = buf.length - offset) {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const step = windowSize / w;
      for (let i = 0; i < w; i++) {
        const sample = buf[offset + Math.floor(i * step)] / 128 - 1; // -1..1
        const y = h / 2 + sample * (h / 2 - 12);
        i === 0 ? ctx.moveTo(i, y) : ctx.lineTo(i, y);
      }
      ctx.stroke();
    }

    function drawStatic() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    function drawScope() {
      animFrameId = requestAnimationFrame(drawScope);
      analyserNode.getByteTimeDomainData(analyserBuf);

      // Find first rising zero-crossing to stabilize the display (trigger)
      let triggerIdx = 0;
      const searchLimit = analyserBuf.length / 2;
      for (let i = 1; i < searchLimit; i++) {
        if (analyserBuf[i - 1] < 128 && analyserBuf[i] >= 128) {
          triggerIdx = i;
          break;
        }
      }

      // Fixed time window: 3 cycles at E4 (329.63 Hz), so higher notes show more cycles
      const windowSize = Math.min(Math.round(3 * audioCtx.sampleRate / 329.63), analyserBuf.length - triggerIdx);

      drawFromBuffer('#7c3aed', analyserBuf, triggerIdx, windowSize);
    }

    // ── Keyboard UI ──
    const WKW = 42, WKH = 130, BKW = 26, BKH = 80;

    function buildKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.style.height = WKH + 'px';

      let whiteIdx = 0;

      NOTES.forEach(note => {
        const el = document.createElement('div');
        el.className = `key ${note.type}`;
        el.dataset.id = note.id;

        if (note.type === 'white') {
          el.style.cssText = `left:${whiteIdx * WKW}px; top:0; width:${WKW}px; height:${WKH}px;`;

          const noteSpan = document.createElement('span');
          noteSpan.className = 'key-note';
          noteSpan.textContent = note.label;

          const kbSpan = document.createElement('span');
          kbSpan.className = 'key-shortcut';
          kbSpan.textContent = note.key.toUpperCase();

          el.appendChild(kbSpan);
          el.appendChild(noteSpan);
          whiteIdx++;
        } else {
          // Center black key over the border between adjacent white keys
          const left = (whiteIdx - 1 + 0.67) * WKW - BKW / 2;
          el.style.cssText = `left:${left}px; top:0; width:${BKW}px; height:${BKH}px;`;

          const kbSpan = document.createElement('span');
          kbSpan.className = 'key-shortcut';
          kbSpan.textContent = note.key.toUpperCase();
          el.appendChild(kbSpan);
        }

        el.addEventListener('mousedown', e => { e.preventDefault(); pressNote(note); mouseNote = note; });
        kb.appendChild(el);
      });

      kb.style.width = (whiteIdx * WKW) + 'px';
    }

    let mouseNote = null;

    document.addEventListener('mouseup', () => {
      if (mouseNote) { releaseNote(mouseNote); mouseNote = null; }
    });

    function keyEl(id) { return document.querySelector(`.key[data-id="${id}"]`); }

    function pressNote(note) {
      if (activeKeys.has(note.key)) return;
      activeKeys.set(note.key, note);
      keyEl(note.id)?.classList.add('active');
      updateTone();
    }

    function releaseNote(note) {
      if (!activeKeys.has(note.key)) return;
      activeKeys.delete(note.key);
      keyEl(note.id)?.classList.remove('active');
      updateTone();
    }

    // ── Keyboard events ──
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const note = keyToNote[e.key.toLowerCase()];
      if (!note) return;
      e.preventDefault();
      pressNote(note);
    });

    document.addEventListener('keyup', e => {
      const note = keyToNote[e.key.toLowerCase()];
      if (!note) return;
      releaseNote(note);
    });

    // ── Init ──
    buildKeyboard();
    drawStatic();
  </script>
</body>
</html>
